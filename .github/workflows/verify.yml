name: Verify preview
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/verify.py
      - run: python tests/test_boot_and_opaque.py --build firmware --out build/ci-cpu
      - run: python tools/package.py --out dist
